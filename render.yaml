services:
  - type: web
    name: ashdot-rental
    runtime: docker
    plan: free # Render Free tier (100% free hosting, no credit card required)
    envVars:
      - key: DATABASE_URL
        sync: false # The user will paste their Supabase connection string in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure JWT secret
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: ""
